name: Build Android GDExtension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: pip install scons

      - name: Install Android NDK 28
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.1.13356709"

      - name: Clone godot-cpp, Pixar OpenSubdiv & Dependencies
        run: |
          git clone --recursive -b master https://github.com/godotengine/godot-cpp.git
          mkdir -p libs
          git clone --depth 1 https://github.com/PixarAnimationStudios/OpenSubdiv.git libs/OpenSubdiv
          git clone https://github.com/zeux/meshoptimizer.git libs/meshoptimizer
          wget -q https://raw.githubusercontent.com/jkuhlmann/cgltf/master/cgltf.h -O libs/cgltf.h

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin
            godot-cpp/gen
          key: godot-cpp-android-arm64-api4.7

      - name: Compile GDExtension
        run: |
          mkdir -p bin
          scons platform=android target=template_debug arch=arm64 api_version=4.7 ANDROID_HOME=$ANDROID_HOME -j$(nproc)

      - name: Check Output Folder
        run: |
          ls -la bin/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcarstudio-android-arm64
          path: bin/
