name: Build Android GDExtension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: pip install scons

      - name: Install Android NDK 28
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.1.13356709"

      - name: Clone godot-cpp, pmp-library & Eigen
        run: |
          git clone --recursive -b master https://github.com/godotengine/godot-cpp.git
          mkdir -p libs
          if [ ! -d "libs/eigen" ]; then
            git clone --depth 1 https://gitlab.com/libeigen/eigen.git libs/eigen
          fi
          if [ ! -d "libs/pmp-library" ]; then
            git clone --depth 1 https://github.com/pmp-library/pmp-library.git libs/pmp-library
          fi

      - name: Compile GDExtension
        run: |
          mkdir -p bin
          scons platform=android target=template_debug arch=arm64 api_version=4.7 ANDROID_HOME=$ANDROID_HOME -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcarstudio-android-arm64
          path: bin/
